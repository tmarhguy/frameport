<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" role="img" aria-label="FramePort capture pipeline: sources converge on FFmpeg; the bounded parser fans out to preview and recording branches">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .session { fill: none; stroke: #888888; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .title { font-size: 13px; font-weight: bold; fill: #111111; }
    .line { font-size: 12px; fill: #333333; }
    .sub { font-size: 11px; fill: #555555; }
    .mono { font-size: 11px; font-family: Menlo, Consolas, monospace; fill: #555555; }
    .edge { stroke: #333333; stroke-width: 1.5; }
  </style>

  <!-- Sources -->
  <rect class="box" x="14" y="14" width="196" height="54" rx="6"/>
  <text class="title" x="112" y="37" text-anchor="middle">AVFoundation</text>
  <text class="sub" x="112" y="55" text-anchor="middle">macOS</text>

  <rect class="box" x="222" y="14" width="196" height="54" rx="6"/>
  <text class="title" x="320" y="37" text-anchor="middle">dshow</text>
  <text class="sub" x="320" y="55" text-anchor="middle">Windows</text>

  <rect class="box" x="430" y="14" width="196" height="54" rx="6"/>
  <text class="title" x="528" y="37" text-anchor="middle">Synthetic</text>
  <text class="sub" x="528" y="55" text-anchor="middle">test pattern</text>

  <!-- Source bus into FFmpeg -->
  <line class="edge" x1="112" y1="68" x2="112" y2="86"/>
  <line class="edge" x1="320" y1="68" x2="320" y2="86"/>
  <line class="edge" x1="528" y1="68" x2="528" y2="86"/>
  <line class="edge" x1="112" y1="86" x2="528" y2="86"/>
  <line class="edge" x1="320" y1="86" x2="320" y2="102" marker-end="url(#arrow)"/>

  <!-- FFmpeg -->
  <rect class="box" x="190" y="104" width="260" height="58" rx="6"/>
  <text class="title" x="320" y="128" text-anchor="middle">FFmpeg</text>
  <text class="line" x="320" y="148" text-anchor="middle">JPEG frame output</text>

  <line class="edge" x1="320" y1="162" x2="320" y2="182" marker-end="url(#arrow)"/>

  <!-- Session boundary -->
  <rect class="session" x="8" y="184" width="624" height="288" rx="10"/>
  <text class="sub" x="22" y="206">session.js — serialized lifecycle · one live capture</text>

  <!-- Bounded parser -->
  <rect class="box" x="190" y="218" width="260" height="62" rx="6"/>
  <text class="title" x="320" y="243" text-anchor="middle">Bounded parser</text>
  <text class="sub" x="320" y="261" text-anchor="middle">latest frame · skip, never queue</text>

  <!-- Fan-out bus -->
  <line class="edge" x1="320" y1="280" x2="320" y2="292"/>
  <line class="edge" x1="168" y1="292" x2="472" y2="292"/>
  <line class="edge" x1="168" y1="292" x2="168" y2="298" marker-end="url(#arrow)"/>
  <line class="edge" x1="472" y1="292" x2="472" y2="298" marker-end="url(#arrow)"/>

  <!-- Preview branch -->
  <rect class="box" x="24" y="300" width="288" height="142" rx="6"/>
  <text class="title" x="168" y="332" text-anchor="middle">Preview branch</text>
  <text class="line" x="168" y="352" text-anchor="middle">loopback endpoint</text>
  <text class="line" x="168" y="368" text-anchor="middle">→ webview canvas</text>
  <text class="line" x="168" y="388" text-anchor="middle">PNG screenshot</text>
  <text class="mono" x="168" y="406" text-anchor="middle">media/screenshots/</text>

  <!-- Recording branch -->
  <rect class="box" x="328" y="300" width="288" height="142" rx="6"/>
  <text class="title" x="472" y="332" text-anchor="middle">Recording branch</text>
  <text class="line" x="472" y="352" text-anchor="middle">on-demand encoder</text>
  <text class="line" x="472" y="368" text-anchor="middle">→ fragmented H.264 MP4</text>
  <text class="line" x="472" y="388" text-anchor="middle">confirmed before Saved</text>
  <text class="mono" x="472" y="406" text-anchor="middle">media/videos/</text>
</svg>
